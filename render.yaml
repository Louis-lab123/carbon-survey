# Render Blueprint. Connect this repo in the Render dashboard (New -> Blueprint).
# DB is Supabase (free, never expires) -> paste its URI into DATABASE_URL below.
services:
  - type: web
    name: carbon-survey
    runtime: docker
    plan: free
    region: singapore          # closest free region to mainland China
    branch: main
    healthCheckPath: /room/carbon
    envVars:
      - key: OTREE_PRODUCTION
        value: "1"
      - key: OTREE_AUTH_LEVEL
        value: STUDY
      - key: OTREE_ADMIN_PASSWORD
        sync: false             # set a strong password in the dashboard
      - key: OTREE_SECRET_KEY
        generateValue: true     # stable across restarts
      - key: OTREE_REST_KEY
        sync: false             # used for create-session / data export API
      - key: DATABASE_URL
        sync: false             # paste Supabase postgresql:// URI here
