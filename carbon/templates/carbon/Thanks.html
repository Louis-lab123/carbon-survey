{% extends "otree/Page.html" %}

{% block title %}问卷结束 · 感谢您的参与{% endblock %}

{% block content %}
<div class="card p-4 text-center">
    <p>🎉 感谢您完成本次调研！</p>
    <p>作为对您参与的感谢，您可以免费下载《{{ filename }}》电子版：</p>
    <form method="post" id="dl-form">
        <button id="btn-download" type="submit" name="download_guide" value="1"
                class="btn btn-primary btn-lg">
            📥 点击下载《{{ filename }}》
        </button>
    </form>
    <p id="dl-status" class="mt-2 text-muted"></p>
    <hr>
    <p class="small text-muted text-start">
        说明：文件将通过浏览器<strong>下载保存</strong>，不会在网页中直接打开预览。<br>
        · 若在微信中打开无法下载，请点击右上角"…"选择"在浏览器打开"；<br>
        · iPhone 用户下载后可在"文件"App 中查看。
    </p>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('dl-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn-download');
        btn.disabled = true;
        document.getElementById('dl-status').textContent = '正在下载…';
        fetch('', {method: 'POST', body: new FormData(this)})
            .then(function (resp) {
                if (!resp.ok) throw new Error('network');
                return resp.blob();
            })
            .then(function (blob) {
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = '{{ filename }}';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
                document.getElementById('dl-status').textContent =
                    '✅ 下载完成（文件已保存到您的设备）';
                btn.disabled = false;
            })
            .catch(function () {
                document.getElementById('dl-status').textContent = '下载失败，请重试。';
                btn.disabled = false;
            });
    });
</script>
{% endblock %}
